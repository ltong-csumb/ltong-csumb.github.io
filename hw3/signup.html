<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="signup">
    <header> 
        <h1>Like No Otter Book Club</h1> 
        <h2>Sign Up Form</h2>
        <p>Sign up for book recommendations and access to our Discord community.</p>
    </header>
    <main>
        <form id="signupForm" action="welcome.html">
            <label>First Name:
                <input type="text" id="fName">
            </label><br>

            <label>Last Name:
                <input type="text" id="lName">
            </label><br>

            <label>Email:
                <input type="text" id="email">
            </label><br>

            <span id="formError"></span><br>

            <button type="submit">Join Our Book Club</button>
        </form>
    </main>

    <script src="js/signup.js"></script>
</body>
</html>
